<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Heart Music</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #muteBtn {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 70, 90, 0.6);
      background: rgba(20, 20, 20, 0.75);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      z-index: 30;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <audio id="bgMusic" src="music.mp3" preload="auto" loop playsinline></audio>
  <button id="muteBtn" aria-label="Toggle Sound">♫</button>
  <div id="startOverlay">اضغط في أي مكان لتشغيل الموسيقى ❤️</div>

  <script>
    const music = document.getElementById('bgMusic');
    const overlay = document.getElementById('startOverlay');
    const muteBtn = document.getElementById('muteBtn');

    function playAudio() {
      music.volume = 1.0;
      const playPromise = music.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          overlay.style.display = 'none';
          muteBtn.textContent = music.muted ? '🔇' : '♫';
        }).catch(() => {
          overlay.style.display = 'flex';
        });
      }
    }

    window.addEventListener('load', playAudio);

    overlay.addEventListener('click', () => {
      music.muted = false;
      playAudio();
    });

    document.body.addEventListener('touchstart', () => {
      if (music.paused) {
        music.muted = false;
        playAudio();
      }
    }, { once: true });

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (music.paused) {
        music.muted = false;
        playAudio();
      } else {
        music.muted = !music.muted;
        muteBtn.textContent = music.muted ? '🔇' : '♫';
      }
    });

    const CONFIG = {
      dr: null,
      traceCount: null,
      trace: 0.4,
      timeDelta: 0.01
    };

    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const rand = Math.random;
    const isPhone = Math.min(window.innerWidth, window.innerHeight) < 650;
    const dr = CONFIG.dr ?? (isPhone ? 0.08 : 0.04);
    const traceCount = CONFIG.traceCount ?? (isPhone ? 22 : 50);
    let W, H, D, S, time = 0;

    function heartPos(r) {
      return [
        Math.pow(Math.sin(r), 3),
        -(15 * Math.cos(r) - 5 * Math.cos(2 * r) - 2 * Math.cos(3 * r) - Math.cos(4 * r))
      ];
    }

    const origin = [];
    for (const [sx, sy] of [[210, 13], [150, 9], [90, 5]]) {
      for (let i = 0; i < Math.PI * 2; i += dr) {
        const [x, y] = heartPos(i);
        origin.push([sx * x, sy * y]);
      }
    }

    const count = origin.length;
    const target = origin.map(([x, y]) => [x, y]);

    function resize() {
      D = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth;
      H = innerHeight;
      cv.width = W * D;
      cv.height = H * D;
      ctx.setTransform(D, 0, 0, D, 0, 0);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      S = Math.min(W / 470, H / 440, 1.7);
    }
    resize();
    addEventListener('resize', resize);

    function pulse(k) {
      for (let i = 0; i < count; i++) {
        target[i][0] = k * origin[i][0] + W / 2;
        target[i][1] = k * origin[i][1] + H / 2;
      }
    }

    const parts = [];
    for (let i = 0; i < count; i++) {
      const x = rand() * W;
      const y = rand() * H;
      const p = {
        vx: 0,
        vy: 0,
        speed: rand() + 5,
        q: ~~(rand() * count),
        D: 2 * (i % 2) - 1,
        force: 0.2 * rand() + 0.7,
        f: `hsla(0,${~~(40 * rand() + 60)}%,${~~(60 * rand() + 20)}%,.3)`,
        trace: []
      };
      for (let k = 0; k < traceCount; k++) parts.push ? p.trace.push({ x, y }) : null;
      parts.push(p);
    }

    function step() {
      const n = -Math.cos(time);
      pulse((1 + n) * 0.5);
      time += (Math.sin(time) < 0 ? 9 : (n > 0.8 ? 0.2 : 1)) * CONFIG.timeDelta;
      ctx.fillStyle = 'rgba(0,0,0,.1)';
      ctx.fillRect(0, 0, W, H);

      for (const p of parts) {
        const u = target[p.q];
        const dx = p.trace[0].x - u[0];
        const dy = p.trace[0].y - u[1];
        const len = Math.sqrt(dx * dx + dy * dy) || 1;

        if (len < 10) {
          if (rand() > 0.95) {
            p.q = ~~(rand() * count);
          } else {
            if (rand() > 0.99) p.D *= -1;
            p.q = (p.q + p.D + count) % count;
          }
        }

        p.vx += (-dx / len) * p.speed;
        p.vy += (-dy / len) * p.speed;
        p.trace[0].x += p.vx;
        p.trace[0].y += p.vy;
        p.vx *= p.force;
        p.vy *= p.force;

        for (let k = 0; k < p.trace.length - 1; k++) {
          const T = p.trace[k];
          const N = p.trace[k + 1];
          N.x -= CONFIG.trace * (N.x - T.x);
          N.y -= CONFIG.trace * (N.y - T.y);
        }

        ctx.fillStyle = p.f;
        for (let k = 0; k < p.trace.length; k++) {
          ctx.fillRect(p.trace[k].x, p.trace[k].y, 1, 1);
        }
      }
    }

    let last = performance.now(), acc = 0;
    function loop(now) {
      acc += Math.min(now - last, 100);
      last = now;
      while (acc >= 16.67) {
        step();
        acc -= 16.67;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
